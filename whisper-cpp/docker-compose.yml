name: whisper-cpp

networks:
  whisper-cpp:
    name: whisper-cpp-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.32.0.0/24

services:
  whisper-cpp:
    image: whisper.cpp:main
    container_name: whisper-cpp
    environment:
      PUID: 1000
      PGID: 1000
    env_file:
      - ../.env
      - .env
    volumes:
      - ./data/models:/models
    entrypoint: ["bash", "-c"]
    command:
      - exec /app/build/bin/whisper-server --host 0.0.0.0 --port 8080 -m "$${WHISPER_CPP_MODEL:-/models/ggml-base.en.bin}"
    ports:
      - 8181:8080
    networks:
      whisper-cpp:
        ipv4_address: 172.32.0.2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - homepage.group=Tools
      - homepage.name=whisper.cpp
      - homepage.icon=https://avatars.githubusercontent.com/u/134263123?v=4
      - homepage.href=http://${CUSTOM_LOCAL_HOST:-localhost}:8181
      - homepage.description=High-performance speech-to-text inference
