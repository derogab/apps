name: hermes-agent

networks:
  hermes-agent:
    name: hermes-agent-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

services:
  hermes-agent:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-agent
    env_file:
      - ../.env
      - ./.env
    environment:
      PUID: 1000
      PGID: 1000
      HERMES_UID: 1000
      HERMES_GID: 1000
      HERMES_DASHBOARD: 1
      HERMES_DASHBOARD_HOST: 0.0.0.0
      HERMES_DASHBOARD_PORT: 9119
      HERMES_DASHBOARD_INSECURE: 1
    volumes:
      - ./data/hermes-agent:/opt/data
    command: ["gateway", "run"]
    ports:
      - 9119:9119
    networks:
      hermes-agent:
        ipv4_address: 172.30.0.2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8642/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    labels:
      - homepage.group=Bots
      - homepage.name=Hermes Agent
      - homepage.icon=https://hermes-agent.nousresearch.com/docs/img/logo.png
      - homepage.href=http://${CUSTOM_LOCAL_HOST:-localhost}:9119
      - homepage.description=Autonomous AI agent
