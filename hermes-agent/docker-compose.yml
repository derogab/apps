name: hermes-agent

networks:
  hermes-agent:
    name: hermes-agent-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

services:
  hermes-agent:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-agent
    env_file:
      - ../.env
      - ./.env
    environment:
      PUID: 1000
      PGID: 1000
      API_SERVER_ENABLED: true
      API_SERVER_HOST: 0.0.0.0
    volumes:
      - ./data/hermes-agent:/opt/data
    networks:
      hermes-agent:
        ipv4_address: 172.30.0.2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8642/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    command: gateway run
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"

  dashboard:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-dashboard
    env_file:
      - ../.env
      - ./.env
    environment:
      PUID: 1000
      PGID: 1000
      GATEWAY_HEALTH_URL: http://hermes-agent:8642
    volumes:
      - ./data/hermes-agent:/opt/data
    ports:
      - 9119:9119
    networks:
      hermes-agent:
        ipv4_address: 172.30.0.3
    depends_on:
      hermes-agent:
        condition: service_healthy
    restart: unless-stopped
    command: dashboard --host 0.0.0.0 --insecure
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    labels:
      - homepage.group=Bots
      - homepage.name=Hermes Agent
      - homepage.icon=https://hermes-agent.nousresearch.com/docs/img/logo.png
      - homepage.href=http://${CUSTOM_LOCAL_HOST:-localhost}:9119
      - homepage.description=Autonomous AI agent
