name: hermes-agent

networks:
  hermes-agent:
    name: hermes-agent-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

services:
  hermes-agent:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-agent
    env_file:
      - ../.env
      - ./.env
    environment:
      PUID: 1000
      PGID: 1000
    volumes:
      - ./data/hermes-agent:/opt/data
    networks:
      hermes-agent:
        ipv4_address: 172.30.0.2
    restart: unless-stopped
    command: gateway run
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    labels:
      - homepage.group=Bots
      - homepage.name=Hermes Agent
      - homepage.icon=https://hermes-agent.nousresearch.com/docs/img/logo.png
      - homepage.href=https://github.com/NousResearch/hermes-agent
      - homepage.description=Autonomous AI agent
