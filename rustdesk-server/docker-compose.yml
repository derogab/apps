name: rustdesk-server

networks:
  rustdesk-server:
    name: rustdesk-server-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.33.0.0/24

services:
  hbbs:
    image: rustdesk/rustdesk-server:latest
    container_name: rustdesk-hbbs
    environment:
      PUID: 1000
      PGID: 1000
    env_file:
      - ../.env
    command: hbbs -r ${CUSTOM_LOCAL_HOST:-localhost}:21117
    volumes:
      - ./data:/root
    ports:
      - 21115:21115
      - 21116:21116
      - 21116:21116/udp
      - 21118:21118
    networks:
      rustdesk-server:
        ipv4_address: 172.33.0.2
    depends_on:
      - hbbr
    restart: unless-stopped
    labels:
      - homepage.group=Tools
      - homepage.name=Rustdesk Server
      - homepage.icon=https://avatars.githubusercontent.com/u/71636191
      - homepage.href=https://github.com/rustdesk/rustdesk-server
      - homepage.description=Self-hosted RustDesk ID and relay server

  hbbr:
    image: rustdesk/rustdesk-server:latest
    container_name: rustdesk-hbbr
    environment:
      PUID: 1000
      PGID: 1000
    env_file:
      - ../.env
    command: hbbr
    volumes:
      - ./data:/root
    ports:
      - 21117:21117
      - 21119:21119
    networks:
      rustdesk-server:
        ipv4_address: 172.33.0.3
    restart: unless-stopped
